spring.application.name=backend_test_project
server.port=8080
server.address=0.0.0.0

# --- Database Configuration ---
# This creates a 'data' folder and a file named 'project_db'
# Added AUTO_SERVER=TRUE so IntelliJ and the browser can both see the data at once
spring.datasource.url=jdbc:h2:file:./data/project_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=deea3458
spring.datasource.password=qerty987

# --- H2 Console Configuration ---
# This fixes the 404 error you saw in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Required to allow the H2 interface to load properly in modern browsers
spring.h2.console.settings.web-allow-others=true

# --- JPA / Hibernate Settings ---
# 'update' keeps your data safe when you restart the app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# This forces Hibernate to use safe names for columns (helps avoid the 'VALUE' error)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jpa.continue-on-error=true